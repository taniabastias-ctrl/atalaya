name: Pruebas

# Corre las pruebas de la plataforma y del agente en cada cambio.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plataforma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test

  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
