name: Licitaciones TI diarias

on:
  # Sin `schedule`: GitHub atrasaba los horarios hasta 7 horas. Lo lanza puntualmente, L-V a las 06:30 de Chile,
  # el Worker de Cloudflare en `agente/disparador/` (vía API workflow_dispatch). También se puede lanzar a mano.
  # El código del agente está en la carpeta agente/ de este repositorio.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: licitaciones
  cancel-in-progress: false

jobs:
  licitaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agente
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      # vistos.json guarda las licitaciones ya reportadas. Se conserva entre ejecuciones con la caché de Actions
      # (cada ejecución guarda una versión nueva y la siguiente recupera la más reciente).
      - name: Recuperar licitaciones ya vistas
        uses: actions/cache/restore@v4
        with:
          path: agente/vistos.json
          key: vistos-${{ github.run_id }}
          restore-keys: vistos-

      # Primera ejecución (caché vacía): partir del registro inicial subido al repo para no repetir lo ya enviado.
      - name: Registro inicial
        run: |
          if [ ! -f vistos.json ] && [ -f vistos_inicial.json ]; then
            cp vistos_inicial.json vistos.json && echo "Usando vistos_inicial.json"
          fi

      - name: Buscar licitaciones, enviar correo y publicar en Atalaya
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ATALAYA_URL: ${{ secrets.ATALAYA_URL || 'https://atalaya-sermaluc.tania-bastias.workers.dev' }}
          ATALAYA_TOKEN: ${{ secrets.ATALAYA_TOKEN }}
          TZ: America/Santiago
        run: python mp_agent.py --dias 1 --min-score 3 --out "licitaciones_$(date +%Y%m%d).xlsx" --mail --atalaya

      - name: Guardar licitaciones vistas
        # también si solo falló la publicación en Atalaya: el correo ya salió y no debe repetir las nuevas mañana
        if: always() && hashFiles('agente/vistos.json') != ''
        uses: actions/cache/save@v4
        with:
          path: agente/vistos.json
          key: vistos-${{ github.run_id }}

      - name: Guardar Excel como respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licitaciones-${{ github.run_id }}
          path: agente/licitaciones_*.xlsx
          retention-days: 30
          if-no-files-found: ignore
