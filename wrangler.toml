# Atalaya · Radar de licitaciones Sermaluc — despliegue en Cloudflare Workers
# Secretos (no van aquí; se cargan con `wrangler secret bulk`): SESSION_SECRET, AGENT_TOKEN (y GOOGLE_CLIENT_SECRET)
name = "atalaya-sermaluc"
main = "servidor/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = false

[assets]
directory = "site"
binding = "ASSETS"
# Solo la API pasa por el Worker; HTML/CSS/JS salen del borde más cercano al usuario
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "atalaya-sermaluc"
database_id = "a7b3a1c9-da1c-4bd8-839d-7ca995b74d56"

# Archivos subidos por el equipo (bases, anexos, documentos preparados)
[[r2_buckets]]
binding = "FILES"
bucket_name = "atalaya-sermaluc-archivos"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[vars]
ALLOWED_DOMAIN = "sermaluc.cl"
ADMIN_EMAILS = "tania.bastias@sermaluc.cl"
DEMO = "0"

# La base D1 vive en el este de EE.UU. (no hay región en Sudamérica): el Worker corre junto a ella
# para que cada consulta tarde ~2 ms en vez de ~150 ms desde Chile.
[placement]
region = "aws:us-east-1"

[observability]
enabled = true
