name = "licitaciones-disparador"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Lunes a viernes 09:30 y 10:30 UTC. El código dispara solo la que cae a las 06:30 en Chile
# (09:30 UTC en horario de verano, 10:30 UTC en invierno).
[triggers]
crons = ["30 9 * * 1-5", "30 10 * * 1-5"]

# Repositorio cuyo workflow "licitaciones.yml" se lanza. El agente ahora vive en agente/ del repo atalaya.
# Publicar este cambio (npx wrangler deploy) SOLO después de copiar los secrets del agente al repo atalaya
# y de dar al GITHUB_TOKEN acceso a ese repo. Ver docs/06-agente.md, "Pasar a un solo repositorio".
[vars]
GITHUB_REPO = "taniabastias-ctrl/atalaya"

[observability]
enabled = true

# Secret (no va en este archivo): GITHUB_TOKEN
#   npx wrangler secret put GITHUB_TOKEN
